# Self-test: scaffold the README quick-start project, drive it through
# the open -> established transition, and pin down the CLI contract
# agents rely on (exit codes, JSON envelopes, aliases, lease identity).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Compile a scaffolded project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scaffold the quick-start project
        run: |
          mkdir -p t/research t/notes
          cat > t/research/main-conjecture.md <<'EOF'
          ---
          rg: 2
          id: main-conjecture
          kind: claim
          title: The main conjecture of the program
          root: true
          goal: true
          ---

          State the thing you are actually trying to prove.
          EOF
          cat > t/research/key-lemma.md <<'EOF'
          ---
          rg: 2
          id: key-lemma
          kind: claim
          title: The key lemma
          ---

          The technical statement everything hinges on.
          EOF
          cat > t/research/via-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: via-key-lemma
          kind: route
          title: Reduce the conjecture to the key lemma
          target: main-conjecture
          requires: [key-lemma]
          ---

          Why the lemma implies the conjecture.
          EOF

      - name: Open state — check, query, site
        working-directory: t
        run: |
          ../bin/cairn check --strict
          ../bin/cairn status
          ../bin/cairn frontier --json | grep key-lemma
          ../bin/cairn why main-conjecture | grep OPEN
          ../bin/cairn impact key-lemma | grep main-conjecture
          ../bin/cairn context main-conjecture --budget 2000
          ../bin/cairn relevant main-conjecture
          ../bin/cairn search --similar "conjecture of the program"
          ../bin/cairn search "key lemma"
          ../bin/cairn site
          test -f .cairn/site/index.html

      - name: CLI contract — exit codes, envelopes, suggestions
        working-directory: t
        run: |
          ../bin/cairn --version
          code=0; ../bin/cairn bogus-command 2>/dev/null || code=$?
          [ "$code" -eq 64 ]
          code=0; ../bin/cairn 2>/dev/null >/dev/null || code=$?
          [ "$code" -eq 64 ]
          code=0; ../bin/cairn why kee-lemma 2>/dev/null || code=$?
          [ "$code" -eq 1 ]
          ../bin/cairn why kee-lemma 2>&1 | grep "nearest: key-lemma"
          ../bin/cairn why kee-lemma --json | grep '"status": "error"'
          code=0; ../bin/cairn lock key-lemma --ttl 10800 2>/dev/null || code=$?
          [ "$code" -eq 1 ]

      - name: Claims — advisory, identity-free
        working-directory: t
        run: |
          ../bin/cairn lock key-lemma --ttl 5m
          code=0; ../bin/cairn lock key-lemma --ttl 5m || code=$?
          [ "$code" -eq 3 ]
          ../bin/cairn frontier | grep 🔒
          ../bin/cairn unlock key-lemma
          ../bin/cairn unlock key-lemma
          ../bin/cairn lock key-lemma --ttl 5m
          ../bin/cairn unlock key-lemma

      - name: Wrapped flow lists compile
        working-directory: t
        run: |
          cat > research/via-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: via-key-lemma
          kind: route
          title: Reduce the conjecture to the key lemma
          target: main-conjecture
          requires: [
            key-lemma]
          ---

          Why the lemma implies the conjecture.
          EOF
          ../bin/cairn check --strict

      - name: Establish the lemma and watch the goal flip
        working-directory: t
        run: |
          cat > research/prove-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: prove-key-lemma
          kind: route
          title: Direct proof of the key lemma
          target: key-lemma
          requires: []
          ---

          The complete argument.
          EOF
          ../bin/cairn build --strict
          ../bin/cairn why main-conjecture | grep "via via-key-lemma"
          ../bin/cairn status --json | grep '"established": 2'

      - name: site --serve answers HTTP
        working-directory: t
        run: |
          ../bin/cairn site --serve --port 8917 & SRV=$!
          sleep 2
          curl -sf http://127.0.0.1:8917/index.html > /dev/null
          curl -sf http://127.0.0.1:8917/main-conjecture.html > /dev/null
          kill $SRV

      - name: pip install
        run: |
          python3 -m pip install --quiet .
          cairn --version
          cd t && cairn check --strict
