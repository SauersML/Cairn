# Self-test: scaffold the README quick-start project, drive it through
# the open -> established transition, and pin down the CLI contract
# agents rely on (exit codes, JSON envelopes, aliases, lease identity).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ui/graph-route-clarity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ui/graph-route-clarity
          fetch-depth: 0
      - name: Apply and syntax-check the UI patch
        run: |
          python3 tools/apply_graph_ui_patch.py
          python3 -m py_compile cairn.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          import cairn
          html = (cairn.INDEX_TMPL.replace('__KATEX__','').replace('__PALETTE__','')
                  .replace('__SANS__','sans-serif').replace('__MONO__','monospace')
                  .replace('__SEARCH_JS__','').replace('__DATA__','{}')
                  .replace('__STATS__','').replace('__TITLE__','Cairn'))
          assert 'id="compact" checked' in html
          assert 'marker id="mi"' in html and 'marker id="mo"' in html
          assert 'premises &#8594; &and; &#8658; target' in html
          assert 'collapsed proof region' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/cairn-site.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cairn-site.js
      - name: Commit the source-only result
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-graph-ui-patch.yml tools/apply_graph_ui_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cairn.py .github/workflows/ci.yml
          git commit -m "Improve graph route direction and compact proven regions"
          git push origin HEAD:ui/graph-route-clarity

  check:
    name: Compile a scaffolded project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scaffold the quick-start project
        run: |
          mkdir -p t/research t/notes
          cat > t/research/main-conjecture.md <<'EOF'
          ---
          rg: 2
          id: main-conjecture
          kind: claim
          title: The main conjecture of the program
          root: true
          goal: true
          ---

          State the thing you are actually trying to prove.
          EOF
          cat > t/research/key-lemma.md <<'EOF'
          ---
          rg: 2
          id: key-lemma
          kind: claim
          title: The key lemma
          ---

          The technical statement everything hinges on.
          EOF
          cat > t/research/via-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: via-key-lemma
          kind: route
          title: Reduce the conjecture to the key lemma
          target: main-conjecture
          requires: [key-lemma]
          ---

          Why the lemma implies the conjecture.
          EOF

      - name: Open state — check, query, site
        working-directory: t
        run: |
          ../bin/cairn check --strict
          ../bin/cairn status
          ../bin/cairn frontier --json | grep key-lemma
          ../bin/cairn why main-conjecture | grep OPEN
          ../bin/cairn impact key-lemma | grep main-conjecture
          ../bin/cairn context main-conjecture --budget 2000
          ../bin/cairn relevant main-conjecture
          ../bin/cairn search --similar "conjecture of the program"
          ../bin/cairn search "key lemma"
          ../bin/cairn site
          test -f .cairn/site/index.html

      - name: CLI contract — exit codes, envelopes, suggestions
        working-directory: t
        run: |
          ../bin/cairn --version
          code=0; ../bin/cairn bogus-command 2>/dev/null || code=$?
          [ "$code" -eq 64 ]
          code=0; ../bin/cairn 2>/dev/null >/dev/null || code=$?
          [ "$code" -eq 64 ]
          code=0; ../bin/cairn why kee-lemma 2>/dev/null || code=$?
          [ "$code" -eq 1 ]
          ../bin/cairn why kee-lemma 2>&1 | grep "nearest: key-lemma"
          ../bin/cairn why kee-lemma --json | grep '"status": "error"'
          code=0; ../bin/cairn lock key-lemma --ttl 10800 2>/dev/null || code=$?
          [ "$code" -eq 1 ]

      - name: Claims — advisory, identity-free
        working-directory: t
        run: |
          ../bin/cairn lock key-lemma --ttl 5m
          code=0; ../bin/cairn lock key-lemma --ttl 5m || code=$?
          [ "$code" -eq 3 ]
          ../bin/cairn frontier | grep 🔒
          ../bin/cairn unlock key-lemma
          ../bin/cairn unlock key-lemma
          ../bin/cairn lock key-lemma --ttl 5m
          ../bin/cairn unlock key-lemma

      - name: Wrapped flow lists compile
        working-directory: t
        run: |
          cat > research/via-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: via-key-lemma
          kind: route
          title: Reduce the conjecture to the key lemma
          target: main-conjecture
          requires: [
            key-lemma]
          ---

          Why the lemma implies the conjecture.
          EOF
          ../bin/cairn check --strict

      - name: Establish the lemma and watch the goal flip
        working-directory: t
        run: |
          cat > research/prove-key-lemma.md <<'EOF'
          ---
          rg: 2
          id: prove-key-lemma
          kind: route
          title: Direct proof of the key lemma
          target: key-lemma
          requires: []
          ---

          The complete argument.
          EOF
          ../bin/cairn build --strict
          ../bin/cairn why main-conjecture | grep "via via-key-lemma"
          ../bin/cairn status --json | grep '"established": 2'

      # A warning nobody can act on costs more than it saves: workers learn
      # to pipe check through 2>/dev/null, and then a real error is invisible
      # too. Each of these fired on a real 449-claim program and was wrong.
      - name: Warnings earn their line
        run: |
          mkdir -p w/research
          cd w
          cat > research/alpha-bound.md <<'EOF'
          ---
          rg: 2
          id: alpha-bound
          kind: claim
          title: The quadrant split admits a compression bound
          root: true
          ---

          The quadrant split of a sofic group admits a compression bound.
          EOF
          cp research/alpha-bound.md research/beta-bound.md
          sed -i 's/id: alpha-bound/id: beta-bound/' research/beta-bound.md
          # the same claim written twice is exactly what the detector is for
          ../bin/cairn check 2>&1 | grep "possible duplicate claim: alpha-bound vs beta-bound"
          # ...but a negation is not a duplicate, however much wording it shares
          sed -i 's/admits a compression bound/does not admit a compression bound/' \
            research/beta-bound.md
          if ../bin/cairn check 2>&1 | grep -q "possible duplicate"; then exit 1; fi
          # an equivalence is two routes, one each way — the kernel's own
          # encoding, not circular reasoning
          cat > research/alpha-from-beta.md <<'EOF'
          ---
          rg: 2
          id: alpha-from-beta
          kind: route
          title: Alpha from beta
          target: alpha-bound
          requires: [beta-bound]
          ---

          One direction.
          EOF
          cat > research/beta-from-alpha.md <<'EOF'
          ---
          rg: 2
          id: beta-from-alpha
          kind: route
          title: Beta from alpha
          target: beta-bound
          requires: [alpha-bound]
          ---

          The converse.
          EOF
          if ../bin/cairn check 2>&1 | grep -q "dependency cycle"; then exit 1; fi
          ../bin/cairn check --strict

      # "38% of checks fail" is unactionable until the log names a rule.
      - name: Telemetry names the rule that fired
        working-directory: w
        run: |
          cat > research/bad-key.md <<'EOF'
          ---
          rg: 2
          id: bad-key
          kind: claim
          title: A claim carrying a key the schema does not allow
          status: established
          ---

          The `status:` key does not exist; status is computed, never declared.
          EOF
          code=0; ../bin/cairn check || code=$?
          [ "$code" -eq 4 ]
          ../bin/cairn telemetry --json | grep '"unknown-key"'
          ../bin/cairn telemetry | grep "lint findings by rule"
          rm research/bad-key.md

      - name: site --serve answers HTTP
        working-directory: t
        run: |
          ../bin/cairn site --serve --port 8917 & SRV=$!
          sleep 2
          curl -sf http://127.0.0.1:8917/index.html > /dev/null
          curl -sf http://127.0.0.1:8917/main-conjecture.html > /dev/null
          kill $SRV

      - name: pip install
        run: |
          python3 -m pip install --quiet .
          cairn --version
          cd t && cairn check --strict
